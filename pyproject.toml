[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "deterministic-agent-manager"
version = "0.1.0"
description = "Deterministic, rule-based Agent Manager for victim-compensation monitoring"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "textual>=0.50.0",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.18.0",
]

[project.scripts]
agent-manager = "main:main"
agent-manager-web = "ui.web.run:main"
agent-manager-tui = "ui.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
