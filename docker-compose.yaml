services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - db-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "main.py"]
    volumes:
      - db-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
